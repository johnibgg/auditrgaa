<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 64" role="img"
     aria-labelledby="titre-logo">
  <title id="titre-logo">AuditRGAA</title>
  <!-- Logo complet, pour les usages où le fichier est servi comme image :
       signature de courriel, annuaires, réseaux sociaux. -->
  <rect x="3" y="3" width="58" height="58" rx="17" fill="none"
        stroke="#1d4ed8" stroke-width="3.5"/>
  <rect x="13" y="13" width="38" height="38" rx="11" fill="#1d4ed8"/>
  <path d="M22.5 32.6 L29.3 39.4 L42 25.6" fill="none" stroke="#ffffff"
        stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="80" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="31" font-weight="700" letter-spacing="-0.5" fill="#0f172a">Audit<tspan fill="#1d4ed8">RGAA</tspan></text>
</svg>
