<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 64" role="img"
     aria-labelledby="titre-logo">
  <title id="titre-logo">Accessia</title>
  <!--
    Logo complet : la marque plus le nom, pour les usages où le fichier est
    servi comme image (signature de courriel, annuaires, réseaux sociaux).
    Couleurs explicites — une image n'hérite pas de `currentColor`.

    Dans l'en-tête du site, c'est la version en ligne dans le HTML qui sert :
    elle, prend `currentColor` et suit donc le thème clair ou sombre.
  -->
  <rect x="3" y="3" width="58" height="58" rx="15"
        fill="none" stroke="#1d4ed8" stroke-width="6"/>
  <rect x="15" y="15" width="34" height="34" rx="8" fill="#1d4ed8"/>
  <path d="M23 32.5 L29.5 39 L41 26.5"
        fill="none" stroke="#ffffff" stroke-width="5.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <text x="78" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="32" font-weight="700" letter-spacing="-1" fill="#0f172a">Accessia</text>
  <text x="215" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="32" font-weight="700" fill="#1d4ed8">.</text>
</svg>
