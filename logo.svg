<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-labelledby="titre-logo">
  <title id="titre-logo">Accessia</title>

  <!--
    L'anneau de focus.

    C'est le contour qui apparaît autour d'un élément quand on navigue au
    clavier — `outline` plus `outline-offset`, exactement ce que notre propre
    feuille de style déclare. Pour un développeur front-end, c'est l'objet le
    plus immédiatement reconnaissable de l'accessibilité, et il ne sert de
    logo à personne.

    Le tracé se lit comme une phrase : un élément (le carré plein), il a le
    focus (l'anneau décalé), il est conforme (la coche).
  -->

  <rect x="4" y="4" width="56" height="56" rx="14"
        fill="none" stroke="currentColor" stroke-width="4.5" opacity=".38"/>

  <rect x="14" y="14" width="36" height="36" rx="8" fill="currentColor"/>

  <path d="M22.5 32.5 L29 39 L41.5 26"
        fill="none" stroke="#ffffff" stroke-width="5.2"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
