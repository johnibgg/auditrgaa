<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 64" role="img"
     aria-labelledby="titre-logo">
  <title id="titre-logo">AuditRGAA</title>
  <!--
    Logo complet : la marque et le nom, pour les usages où le fichier est
    servi comme image (signature de courriel, annuaires, réseaux sociaux).
    Couleurs explicites — une image n'hérite pas de `currentColor`.
  -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none"
        stroke="#1d4ed8" stroke-width="6"/>
  <circle cx="32" cy="32" r="15" fill="none" stroke="#1d4ed8" stroke-width="5"/>
  <path d="M32 17 A15 15 0 0 0 32 47 Z" fill="#1d4ed8"/>

  <text x="78" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="32" font-weight="700" letter-spacing="-1" fill="#0f172a">Audit<tspan fill="#1d4ed8">RGAA</tspan></text>
</svg>
