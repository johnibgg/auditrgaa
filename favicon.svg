<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>AuditRGAA</title>
  <!--
    Un anneau de focus : le contour qui entoure un élément quand on navigue
    au clavier. Couleurs explicites, pas de currentColor : ce fichier est
    aussi servi comme image, et une image n'hérite pas de la couleur du texte.
  -->
  <rect x="3" y="3" width="58" height="58" rx="17" fill="none"
        stroke="#1d4ed8" stroke-width="3.5"/>
  <rect x="13" y="13" width="38" height="38" rx="11" fill="#1d4ed8"/>
  <path d="M22.5 32.6 L29.3 39.4 L42 25.6" fill="none" stroke="#ffffff"
        stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
